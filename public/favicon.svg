<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Tubelight favicon">
  <title>Tubelight</title>
  <desc>A glowing tube shaped like a chat bubble, with multimodal signal nodes representing text, image, audio, and video chat.</desc>

  <!-- Deep app-icon background -->
  <rect width="64" height="64" rx="16" fill="#08111F"/>

  <!-- Soft light aura -->
  <path d="M16 34C16 24.6 23.6 17 33 17h15c2.2 0 4 1.8 4 4v20c0 2.2-1.8 4-4 4H32.5L22 53v-8h-6c-2.2 0-4-1.8-4-4v-7Z"
        fill="#10243A"/>

  <!-- Tubelight chat body -->
  <path d="M18 32c0-7.7 6.3-14 14-14h13c2.2 0 4 1.8 4 4v18c0 2.2-1.8 4-4 4H31.5L22 51v-7h-4c-2.2 0-4-1.8-4-4v-8c0-2.2 1.8-4 4-4Z"
        fill="#16C7D9"/>

  <!-- Inner white tube/light strip -->
  <rect x="20" y="25" width="26" height="13" rx="6.5" fill="#F8FFFF"/>

  <!-- Glowing core forming the T mark -->
  <path d="M29 22h14v5H38v14h-5V27h-4v-5Z" fill="#FFE66D"/>

  <!-- Multimodal signal nodes -->
  <circle cx="23" cy="31.5" r="2.2" fill="#08111F" opacity=".9"/>
  <circle cx="33" cy="31.5" r="2.2" fill="#08111F" opacity=".9"/>
  <circle cx="43" cy="31.5" r="2.2" fill="#08111F" opacity=".9"/>

  <!-- Small spark: intelligence/light -->
  <path d="M51 12l1.6 4.1L57 18l-4.4 1.9L51 24l-1.6-4.1L45 18l4.4-1.9L51 12Z" fill="#FFE66D"/>
</svg>
